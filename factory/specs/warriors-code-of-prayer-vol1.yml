reader_problem: >-
  He believes, more or less. He has not prayed a real prayer in months. The
  devotionals he has been handed were written for a man with a calm week and a
  quiet house, and they do not survive contact with a night shift.
promise: >-
  Forty short prayers built for a man standing post, written in the language he
  actually uses.
transformation: >-
  He goes from praying only in emergencies to holding a short, honest, daily
  position that survives shift work, fatigue, and a job that does not stop.

