how_to_use: >-
  Forty entries. One a day, or one a shift, or one whenever you pick the book
  back up after two weeks of not picking it up. There is no streak to break.


  Each entry runs the same way. An anchor line from scripture. A page of plain
  talk about what that line has to do with the job. A drill, which is one thing
  you do, not one thing you feel. Then a prayer short enough to say in a truck
  with the engine running.


  Say the prayer out loud if you can. Praying in your head is still praying, but
  a man who has learned to keep everything inside his head needs practice
  putting something outside of it.


  The scripture here is the World English Bible, which is public domain. Use
  whatever translation you were raised on. The words are not a spell. They are a
  position.

closing: >-
  Forty days does not make you a holy man. It makes you a man who has prayed
  forty times more than he did last month, which is the only measurable thing
  any of this was ever going to produce.


  Start it again. The entries read differently in February than they did in
  November, because you are not the same man and the job did not stay the same
  either.

about_the_author: >-
  Chris G. Stewart has served as a United States Border Patrol Agent since 2007.
  He was selected for BORSTAR in 2009 and has worked search, trauma, and rescue
  operations since. He is a K-9 handler and instructor, a tracking and human
  remains detection specialist, an Army veteran, and an operations supervisor
  who has planned missions at home and overseas.


  He writes under Ashes to Alpha for men who carry weight for a living.

back_cover_hook: You are not going to become a different man in forty days.
back_cover_copy: >-
  Most devotionals are written for a man with a quiet house and a calm week.
  This one is not.


  Forty entries, each one short enough to finish in a truck with the engine
  running. An anchor from scripture. Plain talk about what it has to do with the
  job. One drill you actually do. One prayer you can say out loud without
  feeling like somebody else is talking.


  For the men who work while the rest of the country sleeps, and for the men who
  used to and are still carrying it.

listing_hook: >-
  You have not prayed a real prayer in months and you know it. Not because you
  stopped believing. Because the job ate the hours where that used to happen.
listing_body: >-
  A Warrior's Code of Prayer is a forty-day devotional written for men who work
  nights, weekends, and holidays in uniform. Border Patrol, police, fire,
  medics, corrections, military, and the men who used to and are still carrying
  it.


  Every entry runs the same four beats. An anchor line from scripture. A page of
  plain talk about what that line has to do with the actual job. A drill, which
  is one thing you do rather than one thing you feel. A prayer short enough to
  say in a truck with the engine running.


  No streaks. No journaling homework. No language that would embarrass you if
  another guy read it over your shoulder in the briefing room.
listing_inside:
  - Forty entries, each one finishable in under five minutes
  - An anchor, a page, a drill, and a prayer in every entry
  - Public domain scripture, so you are not paying for somebody's translation licence
  - An index of every anchor line in the back
  - 5.5 x 8.5 inches, sized for a cargo pocket or a go-bag
listing_for:
  - Law enforcement, fire, EMS, corrections, and military
  - Veterans and retired first responders still carrying the job
  - Fathers who come home at a strange hour and have to be present anyway
  - Anyone who wants a devotional that does not sound like it was written for a retreat
listing_not: >-
  This is not therapy, not a theology course, and not a promise that prayer
  fixes a shift schedule. It is a daily position, written plainly, by a man who
  works the same hours you do.

