units:
  - {number: 1,  title: Taking the Post,        thesis: "Showing up on time is the first act of faith, and it counts even when nothing happens.", anchor: "Psalm 127:1"}
  - {number: 2,  title: The Hours Nobody Sees,  thesis: "Work done where nobody is watching is not wasted work.", anchor: "Matthew 6:6"}
  - {number: 3,  title: Fear on Station,        thesis: "Courage is fear that took the post anyway, and God never asked you to stop feeling it.", anchor: "Joshua 1:9"}
  - {number: 4,  title: Tired Is Not Weak,      thesis: "Fatigue is a physical condition, not a character defect, and it needs rest rather than repentance.", anchor: "Mark 6:31"}
  - {number: 5,  title: The Boredom Watch,      thesis: "Most of the job is nothing happening, and how you hold the nothing decides how you handle the something.", anchor: "Luke 12:37"}
  - {number: 6,  title: Eyes Up,                thesis: "Vigilance is a discipline you rebuild every shift, not a trait you either have or do not.", anchor: "1 Peter 5:8"}
  - {number: 7,  title: The Radio Goes Quiet,   thesis: "Silence from above is not absence, and you already know this from every long night on a dead net.", anchor: "Psalm 13:1"}
  - {number: 8,  title: End of Shift,           thesis: "How you close a shift decides what you carry into the house.", anchor: "Psalm 4:8"}
  - {number: 9,  title: What You Carry,         thesis: "You are carrying more than your gear and you have never once written it down.", anchor: "Matthew 11:28"}
  - {number: 10, title: The Call You Remember,  thesis: "One call sits on top of the stack for every man, and it does not go away by being ignored.", anchor: "Psalm 34:18"}
  - {number: 11, title: Anger in the Truck,     thesis: "Anger is information about something you have not dealt with yet.", anchor: "Ephesians 4:26"}
  - {number: 12, title: The Guilt You Kept,     thesis: "Guilt over a decision made in four seconds needs a verdict, not a rerun.", anchor: "1 John 1:9"}
  - {number: 13, title: Men Who Did Not Make It,thesis: "Grief for the ones who are gone belongs out loud, at least once, to somebody.", anchor: "John 11:35"}
  - {number: 14, title: The Body Keeps Time,    thesis: "Your body is keeping a record of this work whether or not you agree to read it.", anchor: "Psalm 139:14"}
  - {number: 15, title: Drinking It Down,       thesis: "Every man in this work is offered a cheap way to stop feeling, and it always sends a bill.", anchor: "Proverbs 20:1"}
  - {number: 16, title: Asking for Help,        thesis: "Asking for help is a tactical decision, and men who cannot make it get other people hurt.", anchor: "Galatians 6:2"}
  - {number: 17, title: Walking In the Door,    thesis: "The first ninety seconds inside your own house set the next twelve hours.", anchor: "Joshua 24:15"}
  - {number: 18, title: Your Wife Is Not the Enemy, thesis: "Threat posture at home reads as contempt, and she is not wrong to name it.", anchor: "Ephesians 5:25"}
  - {number: 19, title: The Kid Who Waited Up,  thesis: "Presence is measured in minutes given, not in hours intended.", anchor: "Deuteronomy 6:7"}
  - {number: 20, title: Teaching a Boy to Stand,thesis: "Your son learns what a man does by watching what you do when you are tired.", anchor: "Proverbs 22:6"}
  - {number: 21, title: What You Say at the Table, thesis: "What a family talks about at dinner becomes what the children believe is normal.", anchor: "Colossians 4:6"}
  - {number: 22, title: The Days You Miss,      thesis: "You will miss birthdays and games, and how you handle the miss matters more than the miss.", anchor: "Psalm 90:12"}
  - {number: 23, title: Keeping One Promise,    thesis: "One promise kept on a bad day outweighs ten made on a good one.", anchor: "Matthew 5:37"}
  - {number: 24, title: Rest That Is Not Collapse, thesis: "Real rest is scheduled and protected, not what is left over after you fall down.", anchor: "Exodus 20:9"}
  - {number: 25, title: The New Guy,            thesis: "How you treat the newest man tells the whole crew what the standard actually is.", anchor: "1 Timothy 4:12"}
  - {number: 26, title: Leading Tired Men,      thesis: "Leadership on hour fourteen is mostly about lowering the noise and naming the next task.", anchor: "Isaiah 40:31"}
  - {number: 27, title: The Supervisor You Hate,thesis: "You still have to work for him, and how you do it is a decision about you.", anchor: "Romans 12:18"}
  - {number: 28, title: Loyalty With a Spine,   thesis: "Loyalty that cannot say no is not loyalty, it is fear wearing a friendship.", anchor: "Proverbs 27:6"}
  - {number: 29, title: Getting Passed Over,    thesis: "A board, a list, or a promotion is not a verdict on your worth as a man.", anchor: "Psalm 75:6"}
  - {number: 30, title: Keeping Your Word In Writing, thesis: "Reports, statements, and logs are where your integrity becomes a record.", anchor: "Proverbs 12:22"}
  - {number: 31, title: When You Were Wrong,    thesis: "A clean, fast admission costs less than every version of covering it.", anchor: "James 5:16"}
  - {number: 32, title: The Man You Trained,    thesis: "Multiplication is the only thing you build in this job that outlives your tenure.", anchor: "2 Timothy 2:2"}
  - {number: 33, title: The Long Career,        thesis: "Twenty years is a distance event and you cannot sprint it from the front.", anchor: "Hebrews 12:1"}
  - {number: 34, title: The Body Slows Down,    thesis: "The day you cannot do what you did at twenty-five is a planning problem, not a shame problem.", anchor: "2 Corinthians 4:16"}
  - {number: 35, title: Who You Are Without the Badge, thesis: "Identity welded to a job title comes apart on the day the job ends.", anchor: "Galatians 2:20"}
